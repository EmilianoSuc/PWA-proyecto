<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c35">
  <title>Sin conexión | Inventario Verde</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #1b2c28; background: #f4f7f5; font: 16px Arial, sans-serif; }
    main { width: min(440px, 100%); padding: 38px; border: 1px solid #e4ebe7; border-radius: 20px; background: #fff; text-align: center; }
    .icon { width: 58px; height: 58px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 18px; color: #176b52; background: #e8f4ee; font-size: 28px; }
    h1 { margin: 0 0 10px; font-size: 25px; }
    p { color: #6d7b75; line-height: 1.6; }
    a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 9px; color: #fff; background: #176b52; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">⌁</div>
    <h1>No hay conexión</h1>
    <p>La pantalla solicitada no está disponible ahora. Cuando vuelvas a conectarte, podrás consultar el inventario y guardar cambios.</p>
    <a href="./index.html">Volver al inventario</a>
  </main>
</body>
</html>
